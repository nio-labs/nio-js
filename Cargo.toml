[package]
name = "nio-js"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "A QuickJS service runtime with URL modules and portable capsules"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.7.9"
base64 = "0.22"
futures-util = "0.3"
multer = "3"
percent-encoding = "2"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
oxc_allocator = "0.152"
oxc_ast = "0.152"
oxc_ast_visit = "0.152"
oxc_codegen = "0.152"
oxc_parser = "0.152"
oxc_semantic = "0.152"
oxc_span = "0.152"
oxc_sourcemap = "9"
oxc_transformer = "0.152"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rquickjs = { version = "0.14", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
url = "2"
tempfile = "3"
pyo3 = { version = "0.29", optional = true, features = ["auto-initialize"] }

[features]
default = []
python = ["dep:pyo3"]

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14", features = ["bindgen"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
