name: Publish to npm
run-name: Publish ${{ inputs.tag || 'release' }} to npm and GitHub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (leave empty to use package.json version)
        required: false
        type: string
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build, verify, and publish all npm packages
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
      publish: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
