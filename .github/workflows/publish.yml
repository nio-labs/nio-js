name: Publish to npm
run-name: Publish ${{ inputs.tag }} to npm and GitHub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build, verify, and publish all npm packages
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
      publish: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
