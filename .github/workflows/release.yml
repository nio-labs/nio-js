name: release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: false
        type: string
        default: ''
      publish:
        description: Publish validated packages to npm and GitHub
        type: boolean
        default: true
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (leave empty to use package.json version)
        required: false
        type: string
        default: ''
      publish:
        description: Publish to npm and GitHub (otherwise build and test only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate versions and tag
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              VERSION=$(node -p "require('./package.json').version")
              TAG="v$VERSION"
            fi
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          node scripts/check-version.cjs "$TAG"
      - name: Run test suite
        run: npm test

  build:
    needs: validate
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            binary: nio-js
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            binary: nio-js
            rust_target: aarch64-unknown-linux-gnu
          - os: macos-15
            platform: darwin
            arch: arm64
            binary: nio-js
            rust_target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: darwin
            arch: x64
            binary: nio-js
            rust_target: x86_64-apple-darwin
          - os: windows-2022
            platform: win32
            arch: x64
            binary: nio-js.exe
            rust_target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            platform: android
            arch: arm64
            binary: nio-js
            rust_target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - name: Set up Android ARM64 compiler (API 24)
        if: matrix.platform == 'android'
        run: bash scripts/setup-android.sh
      - name: Build native release binary
        run: cargo build --release --locked --target "${{ matrix.rust_target }}"
      - name: Smoke-test the launcher with the native release executable
        if: matrix.platform != 'android'
        env:
          NIO_JS_BIN: target/${{ matrix.rust_target }}/release/${{ matrix.binary }}
        run: node bin/nio-js.cjs --version
      - name: Package platform binary and npm tarball
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          BINARY: ${{ matrix.binary }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          node scripts/package-platform.cjs "target/$RUST_TARGET/release/$BINARY" "$PLATFORM" "$ARCH" dist/artifact
          mkdir -p dist/artifact/npm
          npm pack "./dist/artifact/nio-js-$PLATFORM-$ARCH" --ignore-scripts --pack-destination dist/artifact/npm --json > "dist/artifact/npm/pack-$PLATFORM-$ARCH.json"
          rm -rf "dist/artifact/nio-js-$PLATFORM-$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/artifact/
          if-no-files-found: error

  publish:
    needs: [validate, build]
    if: github.event_name == 'push' || inputs.publish
    name: Publish packages and create GitHub release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up npm publishing
        run: |
          npm install --global npm@11
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm config set '//registry.npmjs.org/:_authToken' '${NODE_AUTH_TOKEN}'
          fi
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/artifacts
      - name: Pack the launcher
        run: npm pack . --ignore-scripts --pack-destination dist/artifacts/npm --json > dist/artifacts/npm/pack-launcher.json
      - name: Verify every artifact and prepare the publish plan
        run: node scripts/prepare-release.cjs
      - name: Include standalone installers
        run: |
          cp install.sh dist/artifacts/release/install.sh
          cp install.ps1 dist/artifacts/release/install.ps1
          cd dist/artifacts/release
          sha256sum install.sh >> SHA256SUMS
          sha256sum install.ps1 >> SHA256SUMS
      - name: Publish platform packages, then the launcher
        run: node scripts/publish-npm.cjs
      - name: Create or update the GitHub release
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/artifacts/release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
